<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Transaksi</title>
<style>
  body{ font-family:Arial,sans-serif; margin:0; padding:0; }
  header,footer{ background:#007BFF; color:white; padding:20px; text-align:center; }
  main{ padding:20px; }
  table{ width:100%; border-collapse:collapse; margin-top:10px; }
  th,td{ border:1px solid #ccc; padding:10px; text-align:left; }
  th{ background:#007BFF; color:white; }
  td img{ width:80px; }
  input[type=number]{ width:60px; }
  select{ padding:5px; margin-top:5px; }
  #totalHarga, #diskonHarga{ font-weight:bold; margin-top:10px; display:block; }
  button{ padding:5px 10px; margin-top:10px; cursor:pointer; border:none; border-radius:5px; background:#007BFF; color:white; }
  button:hover{ background:#0056b3; }
</style>
</head>
<body>
<header>Halaman Transaksi</header>
<main>
  <h2>Detail Pemesanan</h2>
  <table id="tabelTransaksi">
    <thead>
      <tr>
        <th>Gambar</th>
        <th>Nama</th>
        <th>Harga</th>
        <th>Jumlah</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <span id="totalHarga">Total: Rp0</span>
  <span id="diskonHarga"></span>

  <h3>Data Pemesan</h3>
  <label>Nama: <input type="text" id="namaPemesan"></label><br><br>
  <label>Alamat: <input type="text" id="alamatPemesan"></label><br><br>
  <label>Email: <input type="email" id="emailPemesan"></label><br><br>

  <h3>Metode Pembayaran</h3>
  <select id="metodeBayar">
    <option value="">--Pilih Metode Pembayaran--</option>
    <option value="Mandiri">Mandiri</option>
    <option value="BCA">BCA</option>
    <option value="Transfer">Transfer</option>
    <option value="Paylater">Paylater</option>
    <option value="Cash">Cash</option>
    <option value="Virtual Account">Virtual Account</option>
  </select><br><br>

  <button onclick="selesaikanTransaksi()">Selesaikan Transaksi</button>
</main>
<footer>Footer</footer>

<script>
  let keranjang = JSON.parse(localStorage.getItem('keranjang')) || [];
  const tbody = document.querySelector("#tabelTransaksi tbody");

  function tampilkanTransaksi(){
    tbody.innerHTML="";
    keranjang.forEach((p,index)=>{
      let row = document.createElement("tr");
      row.innerHTML=`
        <td><img src="${p.gambar}" alt="${p.nama}"></td>
        <td>${p.nama}</td>
        <td>Rp${p.harga.toLocaleString()}</td>
        <td><input type="number" min="1" value="${p.jumlah}" onchange="updateJumlah(${index}, this.value)"></td>
        <td>Rp${(p.harga*p.jumlah).toLocaleString()}</td>
      `;
      tbody.appendChild(row);
    });
    hitungTotal();
  }

  function updateJumlah(index, value){
    let jumlah = parseInt(value);
    if(jumlah<1) jumlah=1;
    keranjang[index].jumlah=jumlah;
    localStorage.setItem('keranjang', JSON.stringify(keranjang));
    tampilkanTransaksi();
  }

  function hitungTotal(){
    let total = keranjang.reduce((sum,p)=>sum+(p.harga*p.jumlah),0);
    document.getElementById('totalHarga').innerText = `Total: Rp${total.toLocaleString()}`;
    if(total>=500000){
      let diskon = total*0.1;
      let hargaDiskon = total - diskon;
      document.getElementById('diskonHarga').innerText = `Diskon 10%! Harga setelah diskon: Rp${hargaDiskon.toLocaleString()}`;
    }else{
      document.getElementById('diskonHarga').innerText = '';
    }
  }

  function selesaikanTransaksi(){
    let nama = document.getElementById('namaPemesan').value;
    let alamat = document.getElementById('alamatPemesan').value;
    let email = document.getElementById('emailPemesan').value;
    let metode = document.getElementById('metodeBayar').value;

    if(!nama || !alamat || !email){
      alert("Harap lengkapi semua data pemesan!");
      return;
    }

    if(!metode){
      alert("Harap pilih metode pembayaran!");
      return;
    }

    // Simpan data pemesan + metode bayar
    localStorage.setItem('dataPemesan', JSON.stringify({nama, alamat, email, metodeBayar: metode}));

    // Pindah ke halaman invoice
    window.location.href = 'invoice.html';
  }

  tampilkanTransaksi();
</script>
</body>
</html>
